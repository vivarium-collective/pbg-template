name: workspace-ci
on: [push, pull_request]

# Runs on every PR against a workspace scaffolded from this template.
# Sequence:
#   1. Check out workspace + submodules.
#   2. Install workspace deps + each model editably.
#   3. Lint the workspace (workspace.yaml + cross-references).
#   4. Run per-model pytest in parallel.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Set up venv and install
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e .[dev]
          # Install each model editably so its package is on the path
          for m in models/*/; do
            if [ -f "$m/pyproject.toml" ]; then
              uv pip install -e "$m"
            fi
          done
      - name: Lint workspace
        run: |
          source .venv/bin/activate
          python scripts/lint-workspace.py
      - name: Run per-model tests
        run: |
          source .venv/bin/activate
          for m in models/*/; do
            if [ -d "$m/tests" ]; then
              echo "=== $m ==="
              (cd "$m" && pytest -q) || exit 1
            fi
          done
